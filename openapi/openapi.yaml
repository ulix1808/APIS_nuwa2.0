openapi: 3.0.3
info:
  title: Nuwa 2.0 API
  description: |
    API único detrás de **Amazon API Gateway** (región **us-east-1**): catálogo de fuentes, ingest de chunks y búsqueda (searchEngine2.0).
    Los datos viven en **PostgreSQL** (p. ej. RDS u otra instancia). Las Lambdas acceden con **conexión directa** (`psycopg`) y credenciales en **Secrets Manager** (`NUWA_DATABASE_SECRET_ARN`). Tras **`POST /v1/auth/login`**, las rutas protegidas exigen cabecera **`Authorization: Bearer <accessToken>`** (JWT HS256).
    Las **API Keys** de API Gateway siguen existiendo por compañía (usage plan, integración M2M); el valor se guarda **cifrado** (Fernet) en `companies.apigw_key_secret`.     El **gateway ya no exige** `x-api-key` en estas rutas; la autorización es el JWT en Lambda.

    **Autenticación:** el JWT debe enviarse como `Authorization: Bearer <accessToken>`. En rutas **admin**, el body debe incluir **`clientId` y `userId` iguales** a los claims `cid` y `sub` del token; el rol efectivo se toma de **base de datos** (`nuwa_users` + `nuwa_roles`), no solo del claim.

    **Admin — RBAC (resumen):**
    - **`super_admin`:** crear/eliminar compañías; listar todas las compañías; actualizar cualquier compañía; gestionar usuarios de cualquier `clientId`.
    - **`admin` (por tenant):** listar/actualizar solo su compañía; crear/listar/editar usuarios solo de su `client_id` (`targetClientId` debe ser el suyo).
    - **`user`:** no puede usar endpoints admin (403).

    **Search / reportes:** el `clientId` del body o query debe estar permitido por el token (`cid` o `super_admin`).

    **Entidades (PF/PM):** registro en entities por tenant; deduplicación en POST /v1/entities/match (ventana 30 días);
    cada consulta guardada en POST /v1/reports/save con entityId. Screening múltiple: un entityId por sujeto,
    parentEntityId si hay empresa padre, correlación por groupId + groupName (sin empresa padre) o solo parentEntityId (con empresa).
    Un folio/reporte por sujeto (+ uno adicional si se verifica la PM padre).

    Reglas de negocio resumidas:
    - **Admin Nuwa** (`clientId=1`, `userId=1`): fuentes siempre **públicas**.
    - **Usuarios empresa** (`clientId≠1`): fuente **private** (solo su tenant) o **public** (todos).
    - `riskLevel`: **0** = bajo, **1** = medio, **2** = alto, **3** = crítico (misma escala que el admin UI).
  version: 1.0.0
  contact:
    name: Nuwa

servers:
  - url: https://yswipjmkgg.execute-api.us-east-1.amazonaws.com/prod
    description: |
      Prod (referencia). Tras redeploy, alinear con output CloudFormation ApiBaseUrl del stack Nuwa2ApiStack-prod.
  - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
    description: Plantilla (sustituir apiId/stage)
    variables:
      apiId:
        default: your-api-id
      stage:
        default: prod

tags:
  - name: Sources
    description: CRUD del catálogo de fuentes (tabla PostgreSQL `sources`)
  - name: Chunks
    description: Ingest y reemplazo de chunks (`risk_entity_chunks`)
  - name: Search
    description: Búsqueda difusa / RFC (función PostgreSQL `search_risk_entities` + catálogo)
  - name: Reports
    description: Reportes post-búsqueda (tabla `reports`, JSON extensible)
  - name: Entities
    description: |
      Entidades de negocio (Persona Física / Persona Moral) por `client_id`. Match pre-consulta (30 días),
      alta con campos estructurados PF/PM, `relationshipRole`, screening múltiple (`fullName`, `parentEntityId`),
      monitoreo continuo. Ver `docs/ENTIDADES_ROLES_Y_GRUPOS.md`.
  - name: Admin
    description: |
      RBAC con JWT. Requiere `Authorization: Bearer` y body `clientId`/`userId` alineados al token.
      Ver resumen de roles en la descripción global (`info.description`).
  - name: Auth
    description: Login de usuarios de aplicación (sin API Key en gateway)

security:
  - BearerAuth: []

paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login (email y password)
      description: |
        **No requiere** Bearer ni `x-api-key`. Devuelve `user`, `company`, **`accessToken`** (JWT), `tokenType` y `expiresIn`.
        El front usa ese token en `Authorization: Bearer` para el resto de rutas.
        Si el mismo `email` existe en varias compañías, envía `clientId` para desambiguar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Incluye accessToken en la cabecera Authorization Bearer en rutas protegidas"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credenciales inválidas o usuario inactivo
        "503":
          description: Backend de datos no configurado

  /v1/sources:
    post:
      tags: [Sources]
      summary: Crear fuente en el catálogo
      description: |
        Persiste en `public.sources`. **Admin Nuwa** (`clientId=1`, `userId=1`): `visibility` se fuerza a `public`.
        El JWT debe alinearse con `clientId`/`userId` del body; `super_admin` puede actuar sobre cualquier `clientId`.
        **Obligatorio** `sourceCategoryId`: FK a `source_categories` (debe existir y estar **activa**). Clientes antiguos que no envíen el campo reciben **400** con mensaje explícito (no hay categoría por defecto).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
            example:
              clientId: 1
              userId: 1
              name: SAT
              riskLevel: 1
              visibility: public
              sourceCategoryId: 1
              metadata: {}
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceResponse"
              example:
                sourceId: 42
                name: SAT
                riskLevel: 1
                visibility: public
                clientId: 1
                createdByUserId: 1
                sourceCategoryId: 1
                metadata: {}
                createdAt: "2026-05-02T12:00:00Z"
                updatedAt: "2026-05-02T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sources/list:
    post:
      tags: [Sources]
      summary: Listar fuentes visibles para el tenant
      description: |
        Devuelve filas de `public.sources` con `visibility=public` **o** `client_id` igual al `clientId` del body (tenant en JWT).
        Respuesta incluye **`success`**, **`meta.categories`** (catálogo completo en una sola carga; por defecto solo categorías **activas**) para poblar dropdowns sin segunda llamada.
        **`meta.categories`** es **global** (no hay segregación por tenant): cualquier usuario que pueda listar fuentes ve el mismo conjunto de categorías activas.
        Query opcional **`includeInactiveCategories=true`**: incluye también inactivas; **solo `super_admin`** (equivale al mismo flag en el body JSON).
        Campo `total`: recuento global con el mismo filtro en modo PostgreSQL directo; en PostgREST puede omitirse.
        `nextOffset`: presente si hay más páginas cuando `total` está disponible.
        Opcional `includeCategory: true`: incluye objeto `category` anidado por ítem (**solo** con backend PostgreSQL directo; con PostgREST solo verás `sourceCategoryId`).
      security:
        - BearerAuth: []
      parameters:
        - name: includeInactiveCategories
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Solo **super_admin**. Si es true, `meta.categories` lista activas e inactivas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListSourcesRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSourcesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sources/get:
    post:
      tags: [Sources]
      summary: Obtener una fuente por sourceId
      description: |
        Visible si es `public` o si `client_id` de la fila coincide con el `clientId` del actor; `super_admin` ve cualquiera.
        Opcional `includeCategory: true`: objeto `category` anidado (**solo** PostgreSQL directo).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetSourceRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sources/update:
    post:
      tags: [Sources]
      summary: Actualizar metadatos de la fuente
      description: |
        Solo `super_admin` o filas cuyo `client_id` coincide con el `clientId` del JWT (mismo criterio que delete).
        Opcional `sourceCategoryId`: si se envía entero, debe referenciar categoría **existente y activa**; `null` borra la FK (fuente sin categoría).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSourceRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sources/delete:
    post:
      tags: [Sources]
      summary: Eliminar fuente y sus chunks (CASCADE en DB)
      description: |
        Borrado físico en `public.sources`; `risk_entity_chunks` asociados se eliminan por FK `ON DELETE CASCADE`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSourceRequest"
      responses:
        "204":
          description: Sin contenido
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/source-category-id/create:
    post:
      tags: [Sources]
      summary: Crear categoría de fuente
      description: |
        Inserta en `public.source_categories`. **Solo `super_admin`.**
        El body debe alinear `clientId` / `userId` con el JWT (como admin).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceCategoryRequest"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/source-category-id/list:
    post:
      tags: [Sources]
      summary: Listar categorías de fuentes
      description: |
        **`super_admin`** y **`admin`** (rol efectivo en BD). Paginación opcional.
        Si omites `isActive`, se listan activas e inactivas.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListSourceCategoriesRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSourceCategoriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/source-category-id/{id}:
    get:
      tags: [Sources]
      summary: Obtener categoría por id
      description: |
        **`super_admin`** y **`admin`**. Query **`clientId`** y **`userId`** deben coincidir con el JWT (`cid` / `sub`).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: clientId
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/chunks/ingest:
    post:
      tags: [Chunks]
      summary: Insertar o reemplazar chunks de una fuente
      description: |
        Persiste en `public.risk_entity_chunks`. Cada fila usa **`client_id` de la fuente** (`sources.client_id`), no un valor arbitrario del cliente. El actor debe poder **mutar** esa fuente (misma regla que crear/actualizar en el catálogo): `super_admin` cualquier fuente; en otro caso la fuente debe pertenecer al tenant (`client_id` = `clientId` del body).

        - **`replaceStrategy=all`**: elimina todos los chunks del `sourceId` y luego inserta el lote. En **PostgreSQL directo** va en una transacción. Con **PostgREST**, borrado e inserción son llamadas separadas (no atómicas entre sí).
        - **`replaceStrategy=append`**: solo inserta.

        **`riskLevel`**, **`visibility`** y **`entityType`** son opcionales. Si se omiten, `riskLevel` y `visibility` se toman de la fila `sources`; `entityType` por defecto es `entity`. Los elementos de `chunks` se ordenan por `order` ascendente antes de insertar.

        El JWT debe alinearse con `clientId`/`userId` del body; `super_admin` puede actuar sobre cualquier `clientId` (mismo criterio que el catálogo de fuentes).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestChunksRequest"
      responses:
        "200":
          description: Completado (`status=completed`, recuento de insertados y, si aplica, borrados)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestChunksResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          description: Backend de datos no configurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/search:
    post:
      tags: [Search]
      summary: Búsqueda de entidades en chunks (nombre y/o RFC)
      description: |
        El alcance de filas lo define solo la base de datos: chunks con `visibility=public` **más** los
        chunks `private` cuyo `client_id` coincide con el `clientId` del body. El cliente **no** envía
        lista de fuentes (`sourceIds`).

        El backend invoca la función PostgreSQL `search_risk_entities` y enriquece cada resultado con `sourceName` desde el catálogo.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/entities/match:
    post:
      tags: [Entities]
      summary: Buscar entidades existentes (deduplicación pre-consulta)
      description: |
        Busca entidades del `clientId` consultadas en los **últimos 30 días** (`last_screening_at`).

        **Persona moral:** `legalName` (razón social) y/o `rfc`. Si vienen ambos, la coincidencia fuerte exige ambos.
        **Persona física:** `firstName`, `lastName` y/o `rfc`/`curp`. Si vienen nombre e identificador, la coincidencia fuerte exige ambos.

        Usar **antes** de `POST /v1/search`. No persiste datos.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityMatchRequest"
      responses:
        "200":
          description: Coincidencias ordenadas por confianza
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityMatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/entities/create:
    post:
      tags: [Entities]
      summary: Crear entidad
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityCreateRequest"
      responses:
        "201":
          description: Entidad creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: RFC o CURP duplicado en el tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/entities/list:
    post:
      tags: [Entities]
      summary: Listar entidades (tabla /entities)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityListRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/entities/get:
    post:
      tags: [Entities]
      summary: Detalle de entidad y reportes vinculados
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityGetRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityGetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/entities/update:
    post:
      tags: [Entities]
      summary: Actualizar entidad
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitySummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/entities/delete:
    post:
      tags: [Entities]
      summary: Eliminar entidad (lógico)
      description: Marca `status=deleted`. Los reportes históricos conservan `entity_id`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityDeleteRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entityId, status]
                properties:
                  entityId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [deleted]
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/entities/stats:
    post:
      tags: [Entities]
      summary: Métricas para widgets de /entities
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActorContext"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityStatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/entities/monitoring/upsert:
    post:
      tags: [Entities]
      summary: Configurar monitoreo continuo de una entidad
      description: |
        Crea o actualiza la fila en `entity_monitoring`. Requiere `entityId` de una entidad ya persistida
        (no se permite monitoreo sin entidad). Frecuencias: weekly, monthly, semi-annual, annual.
        Fuentes: `compliance` (sanciones, PEPs, regulatorio → flujo `/v1/search`) y `media` (medios adversos).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityMonitoringUpsertRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityMonitoringResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/entities/monitoring/list:
    post:
      tags: [Entities]
      summary: Listar entidades con monitoreo continuo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityMonitoringListRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityMonitoringListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/reports/get:
    get:
      tags: [Reports]
      summary: Listar o consultar reportes (query string, sin body)
      description: |
        Al menos uno de `clientId`, `userId` o `folio`. Opcional: `includePayload=true` (objeto completo con `payload`),
        `nextKey` (paginación), `limit` (1–100, default 20).

        **RBAC opcional:** `actorUserId` y `actorClientId` — si se envían, los resultados se filtran según rol en `nuwa_users`.
      security:
        - BearerAuth: []
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: integer, format: int32 }
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int32 }
        - name: folio
          in: query
          schema: { type: string }
        - name: includePayload
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: nextKey
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: actorUserId
          in: query
          schema: { type: integer, format: int32 }
        - name: actorClientId
          in: query
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: |
            **Listado:** `{ items, count, nextKey?, filters? }` (resúmenes camelCase por fila).
            **Por `folio`:** un solo objeto resumen; con `includePayload=true` incluye `payload` (JSON completo guardado, mismo formato que en `report` al guardar).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReportsGetListResponse"
                  - $ref: "#/components/schemas/ReportsGetSingleResponse"
              examples:
                listado:
                  summary: Varios reportes (clientId o userId)
                  value:
                    items:
                      - folio: SE-1772866470970
                        clientId: 1
                        userId: 42
                        entidad: Cisco
                        tipoConsulta: Persona Fisica o Moral
                        fecha: "2026-03-07"
