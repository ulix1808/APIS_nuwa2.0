                type: string
                format: date-time

    EntityUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ActorContext"
        - type: object
          required: [entityId]
          properties:
            entityId:
              type: string
              format: uuid
            name:
              type: string
            partyType:
              $ref: "#/components/schemas/PartyType"
            category:
              $ref: "#/components/schemas/EntityCategory"
            rfc:
              type: string
            curp:
              type: string
            country:
              type: string
            riskLevel:
              type: string
            status:
              type: string
            metadata:
              type: object
              additionalProperties: true

    EntityDeleteRequest:
      allOf:
        - $ref: "#/components/schemas/ActorContext"
        - type: object
          required: [entityId]
          properties:
            entityId:
              type: string
              format: uuid

    EntityStatsResponse:
      type: object
      required:
        - totalEntities
        - inReviewCount
        - individualsCount
        - individualsHighRisk
        - organizationsCount
        - organizationsHighRisk
        - highRiskTotal
        - highRiskPercent
      properties:
        totalEntities:
          type: integer
        inReviewCount:
          type: integer
        individualsCount:
          type: integer
        individualsHighRisk:
          type: integer
        organizationsCount:
          type: integer
        organizationsHighRisk:
          type: integer
        highRiskTotal:
          type: integer
        highRiskPercent:
          type: number
          format: float

    EntityMonitoringUpsertRequest:
      allOf:
        - $ref: "#/components/schemas/ActorContext"
        - type: object
          required: [entityId, enabled]
          properties:
            entityId:
              type: string
              format: uuid
            enabled:
              type: boolean
            frequency:
              $ref: "#/components/schemas/MonitoringFrequency"
            sources:
              type: array
              items:
                $ref: "#/components/schemas/MonitoringSource"

    EntityMonitoringResponse:
      type: object
      required: [entityId, enabled]
      properties:
        monitoringId:
          type: string
          format: uuid
        entityId:
          type: string
          format: uuid
        enabled:
          type: boolean
        frequency:
          $ref: "#/components/schemas/MonitoringFrequency"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringSource"
        nextRunAt:
          type: string
          format: date-time
          nullable: true

    EntityMonitoringListRequest:
      allOf:
        - $ref: "#/components/schemas/ActorContext"
        - type: object
          properties:
            activeOnly:
              type: boolean
              default: true
            limit:
              type: integer
              default: 100
            offset:
              type: integer
              default: 0

    EntityMonitoringListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/EntitySummary"
              - type: object
                properties:
                  monitoringId:
                    type: string
                    format: uuid
                  frequency:
                    $ref: "#/components/schemas/MonitoringFrequency"
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/MonitoringSource"
                  nextRunAt:
                    type: string
                    format: date-time
                    nullable: true
        total:
          type: integer

    ErrorBody:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        requestId:
          type: string
          format: uuid

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: "JWT ausente, expirado o inválido (cabecera Authorization Bearer)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: Token válido pero sin permiso (p. ej. rol `user` en admin, o `clientId` no permitido)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ServerError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
